<div class="table-wrap"><table><thead><tr><th>Run</th><th>Workflow</th><th>Kind</th><th>Runner</th><th>Status</th><th>Started</th></tr></thead><tbody>{% for run in runs %}<tr><td><a href="{% url 'run-detail-page' run.id %}">#{{ run.id }}</a></td><td>{{ run.workflow_version.workflow.name }} · v{{ run.workflow_version.number }}</td><td>{{ run.kind }}</td><td>{{ run.runner.name|default:'Unclaimed' }}</td><td><span class="status {{ run.status }}">{{ run.status }}</span></td><td>{{ run.started_at|default:run.created_at }}</td></tr>{% empty %}<tr><td colspan="6" class="empty">No runs yet.</td></tr>{% endfor %}</tbody></table></div>
